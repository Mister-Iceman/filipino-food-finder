<svg xmlns="http://www.w3.org/2000/svg" width="200" height="60" viewBox="0 0 200 60" role="img" aria-label="Proudly Listed on FilipinoFoodNearMe.org">
  <title>Proudly Listed on FilipinoFoodNearMe.org</title>
  <defs>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#BF2F26"/>
      <stop offset="50%"  stop-color="#CB5B16"/>
      <stop offset="100%" stop-color="#D1880D"/>
    </linearGradient>
    <!-- Clip everything to the badge's rounded-rect shape -->
    <clipPath id="badgeClip">
      <rect width="200" height="60" rx="6" ry="6"/>
    </clipPath>
  </defs>

  <g clip-path="url(#badgeClip)">
    <!-- Background -->
    <rect width="200" height="60" fill="#62438D"/>

    <!-- Subtle inner highlight at top for depth -->
    <rect width="200" height="1" y="0" fill="rgba(255,255,255,0.15)"/>

    <!-- Bottom accent bar -->
    <rect x="0" y="55" width="200" height="5" fill="url(#accentGrad)"/>

    <!-- Philippine flag emoji -->
    <text x="12" y="28"
      font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif"
      font-size="15"
    >🇵🇭</text>

    <!-- "PROUDLY LISTED ON" label -->
    <text
      x="102" y="25"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
      font-size="8.5"
      font-weight="500"
      letter-spacing="0.8"
      fill="rgba(255,255,255,0.72)"
      text-anchor="middle"
    >PROUDLY LISTED ON</text>

    <!-- "FilipinoFoodNearMe.org" -->
    <text
      x="102" y="42"
      font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif"
      font-size="12.5"
      font-weight="700"
      fill="#ffffff"
      text-anchor="middle"
    >FilipinoFoodNearMe.org</text>
  </g>
</svg>
